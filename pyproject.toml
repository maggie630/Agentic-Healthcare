[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-healthcare-patient-store"
version = "0.1.0"
description = "Standalone hospital database and patient_store MCP module"
requires-python = ">=3.11"
dependencies = ["mcp==1.12.4", "python-dotenv==1.1.1", "pydantic==2.11.7"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
